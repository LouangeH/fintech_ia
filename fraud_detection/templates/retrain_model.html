<!DOCTYPE html>
<html>
<head>
    <title>Réentraînement du modèle IA</title>
    <script>
        async function retrainModel() {
            const response = await fetch("/api/retrain-model/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                }
            });
            const result = await response.json();
            document.getElementById("result").innerText = result.message || result.error;
        }

        // Fonction pour récupérer le token CSRF de Django
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</head>
<body>
    <h1>Réentraînement du modèle IA de fraude</h1>
    <button onclick="retrainModel()">Réentraîner le modèle</button>
    <p id="result" style="font-weight: bold; margin-top: 20px;"></p>
</body>
</html>
